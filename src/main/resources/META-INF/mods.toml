modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    logoFile = "logo.png"
    logoBlur = false
    displayURL = ""
    updateJSONURL = "https://www.github.com/NoraLunan/Tide-of-Duskveil-Nightfall/raw/master/version.json"
    authors = "${mod_authors}"
    description = '''${mod_description}'''

[[dependencies.${mod_id}]]
    modId = "forge"
    mandatory = true
    versionRange = "${forge_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "noralib"
    mandatory = true
    versionRange = "${noralib_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "tweakerge"
    mandatory = false
    versionRange = "[0.1.0,)"
    ordering = "AFTER"
    side = "CLIENT"